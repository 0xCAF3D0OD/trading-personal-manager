services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tpm-api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/app.db
      # Le front est servi par nginx sur la même origine : pas de CORS nécessaire.
      CORS_ORIGIN: ""
      RENDERER_URL: http://renderer:3100
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Rendu sans tête pour la veille (pages rendues côté client). Réseau interne, aucune clé, un rendu à la fois.
  renderer:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    container_name: tpm-renderer
    restart: unless-stopped
    mem_limit: 768m
    shm_size: 256m
    expose:
      - "3100"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tpm-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
